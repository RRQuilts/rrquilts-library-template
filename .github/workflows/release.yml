name: Release .rrqlib files
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run tools/validate.py
      - run: uv run tools/release.py
      - name: Publish the release with the .rrqlib files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.rrqlib --title "$GITHUB_REF_NAME" --notes "Import a .rrqlib in RRQuilts › Libraries › Import. -256 is Light, -512 Standard (-1024, if present, for printing)."
